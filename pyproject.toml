[project]
name = "job-applyer"
version = "0.1.0"
description = "Local Python TUI for US job applications (Grok Build–inspired)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.0.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
job-applyer = "job_applyer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_applyer"]

[tool.uv]
package = true
